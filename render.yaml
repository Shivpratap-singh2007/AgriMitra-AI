services:
  - type: web
    name: agrimitra-ai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEVICE_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /app/backend/data/agrimitra.db
